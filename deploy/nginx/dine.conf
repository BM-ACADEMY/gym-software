# dine.afraventures.in -> apps/dine/client/dist (site) and 127.0.0.1:5009 (/api). Sample, written 13 Nov 2026, not yet run by a person.
# Install once: sudo cp 10-prod-common.conf /etc/nginx/conf.d/ ; sudo cp prod-proxy.conf prod-security-headers.conf /etc/nginx/snippets/
# Then: sudo cp dine.conf /etc/nginx/sites-available/dine.afraventures.in && sudo ln -s /etc/nginx/sites-available/dine.afraventures.in /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d dine.afraventures.in
# certbot adds the HTTPS (443) part and the redirect. Do not open port 5009 to the internet.
server {
  listen 80;
  listen [::]:80;
  server_name dine.afraventures.in;

  root /srv/afraprod/current/apps/dine/client/dist;
  index index.html;
  client_max_body_size 2m;
  limit_conn prod_conn 40;

  include /etc/nginx/snippets/prod-security-headers.conf;

  # Sign-in, sign-up, password and OTP routes: tight limit.
  location ~ ^/api/.*/(auth|login|signup|register|otp|password)(/|$) {
    limit_req zone=prod_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:5009;
    include /etc/nginx/snippets/prod-proxy.conf;
  }

  # Public QR menu page (not under /api): token links only, rate limited.
  location /dine-public/ {
    limit_req zone=prod_public burst=20 nodelay;
    proxy_pass http://127.0.0.1:5009;
    include /etc/nginx/snippets/prod-proxy.conf;
  }

  location /api/ {
    limit_req zone=prod_api burst=30 nodelay;
    proxy_pass http://127.0.0.1:5009;
    include /etc/nginx/snippets/prod-proxy.conf;
  }

  location = /sw.js { include /etc/nginx/snippets/prod-security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { include /etc/nginx/snippets/prod-security-headers.conf; add_header Cache-Control "no-cache"; }
  location /assets/ { include /etc/nginx/snippets/prod-security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
