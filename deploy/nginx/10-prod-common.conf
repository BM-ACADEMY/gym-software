# Put in /etc/nginx/conf.d/10-prod-common.conf (http level). SHARED SERVER: every name here starts with prod_ so it cannot clash with the Lead Hub, Postiz or Reels files already on the server. No server_tokens line (set once elsewhere). Written 13 Nov 2026, not yet run by a person.
# Shared rate-limit zones for every Afra product site. Afra AI OS keeps its own nginx files; do not edit those.
limit_req_zone $binary_remote_addr zone=prod_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=prod_auth:10m rate=20r/m;   # sign-in, sign-up, password and OTP routes (a gym or shop shares one wifi address, so not tighter)
limit_req_zone $binary_remote_addr zone=prod_public:10m rate=30r/m; # public booking, menu, pickup and share links
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=prod_conn:10m;
