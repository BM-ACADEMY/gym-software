# hire.afraventures.in -> apps/hire/client/dist (site) and 127.0.0.1:5006 (/api). Sample, written 13 Nov 2026, not yet run by a person.
# Install once: sudo cp 00-afra-common.conf /etc/nginx/conf.d/ ; sudo cp afra-proxy.conf afra-security-headers.conf /etc/nginx/snippets/
# Then: sudo cp hire.conf /etc/nginx/sites-available/hire.afraventures.in && sudo ln -s /etc/nginx/sites-available/hire.afraventures.in /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d hire.afraventures.in
# certbot adds the HTTPS (443) part and the redirect. Do not open port 5006 to the internet.
server {
  listen 80;
  listen [::]:80;
  server_name hire.afraventures.in;

  root /srv/afra/current/apps/hire/client/dist;
  index index.html;
  client_max_body_size 10m;
  limit_conn afra_conn 40;

  include /etc/nginx/snippets/afra-security-headers.conf;

  # Sign-in, sign-up, password and OTP routes: tight limit.
  location ~ ^/api/.*/(auth|login|signup|register|otp|password)(/|$) {
    limit_req zone=afra_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:5006;
    include /etc/nginx/snippets/afra-proxy.conf;
  }

  # Public client shortlist and candidate consent pages call these; token links only, rate limited.
  location ~ ^/api/(hire-share|hire-consent)/ {
    limit_req zone=afra_public burst=20 nodelay;
    proxy_pass http://127.0.0.1:5006;
    include /etc/nginx/snippets/afra-proxy.conf;
  }

  location /api/ {
    limit_req zone=afra_api burst=30 nodelay;
    proxy_pass http://127.0.0.1:5006;
    include /etc/nginx/snippets/afra-proxy.conf;
  }

  location = /sw.js { include /etc/nginx/snippets/afra-security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { include /etc/nginx/snippets/afra-security-headers.conf; add_header Cache-Control "no-cache"; }
  location /assets/ { include /etc/nginx/snippets/afra-security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
