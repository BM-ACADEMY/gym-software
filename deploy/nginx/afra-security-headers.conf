# Put in /etc/nginx/snippets/afra-security-headers.conf. Included at server level and again inside any location that sets
# its own add_header (nginx drops inherited headers there). A strict Content-Security-Policy is a later task.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always; # only takes effect over HTTPS, which certbot adds
